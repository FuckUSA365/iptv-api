[Settings]
;
source_file = config/user_demo.txt
final_file = output/user_result.txt
# 接口最小分辨率，需要开启 open_filter_resolution 才能生效 | Minimum resolution of the interface, need to enable open_filter_resolution to take effect
min_resolution = 1920x1080
# CDN 代理加速地址，用于订阅源、频道图标等资源的加速访问；支持配置多个（用英文逗号分隔），订阅源与 EPG 会按顺序逐个回退拉取，任一镜像成功即停，频道图标等资源使用第一个地址 | CDN proxy acceleration address(es) for subscription sources, channel logos and other resources; multiple are supported (comma-separated), subscription and EPG sources fall back through them in order until one succeeds, channel logos use the first address
cdn_url = https://gh-proxy.com/
